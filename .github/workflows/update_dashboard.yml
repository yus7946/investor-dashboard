name: Update Dashboard

on:
  schedule:
    # ── フル更新（EDINET/JPX/ニュース/バックテスト/決算日を含む重い処理）──
    # JST 4:37 = UTC 19:37（前日）。平日のみ。寄付き前に1回だけ重い取得を行う。
    # 実績上、朝の定期実行は予定より2〜3時間遅れて始まる（2026-10-14〜19: 1:57〜3:08の遅れ）。
    # 早めに置き、米国市場の終了前に始まってしまった場合は下の「Wait for US close」で6:05まで待つ。
    - cron: "37 19 * * 0-4"
    # 2026-11-18〜21は定期実行が毎日約6時間遅れ（4:37の予定が10:25ごろ開始）、予報が毎日寄付き後になった。
    # 深夜にも起動予定を置き、早く始まったら下の「Wait for US close」で6:25まで待つ。遅れても寄付き前に間に合いやすくする。
    # JST 1:07 = UTC 16:07、JST 3:07 = UTC 18:07（前日）
    - cron: "7 16 * * 0-4"
    - cron: "7 18 * * 0-4"
    # 2026-11-24は遅れが約11時間（1:07の予定が11:52開始）。前日の夜にも置き、遅れが5〜11時間でもどれかが寄付き前に間に合うように。
    # JST 19:07 = UTC 10:07、21:07 = UTC 12:07、23:07 = UTC 14:07（日〜木＝翌朝が平日）。0:55より前に始まった回は何もせず終わる
    - cron: "7 10 * * 0-4"
    - cron: "7 12 * * 0-4"
    - cron: "7 14 * * 0-4"
    # ── 予備（ライト）: JST 6:07 = UTC 21:07。朝のフル更新が遅延・失敗しても予報を出すため。
    # 今日の確定予報が既にあれば予報は作り直さない（main.py の is_final_for_today）。
    - cron: "7 21 * * 0-4"
    # ── ライト更新（株価・スマートマネー・シグナル・見通しのみ。毎時）──
    # 日中はJPX/EDINETが更新されないため、値動き系だけを高頻度で更新する。
    # これによりYahoo/JPX/EDINETへの高頻度アクセス（IPブロック）リスクを避ける。
    # JST 10:30 = UTC 1:30
    - cron: "30 1 * * 1-5"
    # JST 11:30 = UTC 2:30
    - cron: "30 2 * * 1-5"
    # JST 12:30 = UTC 3:30（後場寄り）
    - cron: "30 3 * * 1-5"
    # JST 13:30 = UTC 4:30
    - cron: "30 4 * * 1-5"
    # JST 14:30 = UTC 5:30
    - cron: "30 5 * * 1-5"
    # JST 15:10 = UTC 6:10（大引け直後）
    - cron: "10 6 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "更新モード (full=全取得 / light=値動きのみ)"
        required: false
        default: "full"

# 遅れて起動した定期実行が重なっても、git push が衝突しないよう1本ずつ順番に実行する。
concurrency:
  group: update-dashboard
  cancel-in-progress: false

permissions:
  contents: write
  actions: write  # 下の Keep schedule alive ステップで使用

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # スケジュール起動: UTC23:30（JST8:30の寄付き前）だけフル、それ以外の毎時はライト。
      # 手動起動: 入力modeに従う（既定full）。
      - name: Decide mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "light=${{ github.event.inputs.mode == 'light' && '1' || '0' }}" >> "$GITHUB_OUTPUT"
          else
            # 朝のフル更新（深夜・前日夜の起動を含む）はフル、それ以外の毎時はライト
            case "${{ github.event.schedule }}" in
              "37 19 * * 0-4"|"7 16 * * 0-4"|"7 18 * * 0-4"|"7 10 * * 0-4"|"7 12 * * 0-4"|"7 14 * * 0-4") echo "light=0" >> "$GITHUB_OUTPUT" ;;
              *) echo "light=1" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
      # 米国市場(夏時間5:00/冬時間6:00 JST終了)と先物の清算値(冬6:00)が出そろう6:25 JSTまで待つ（最大5.5時間）。
      # 5.5時間より前（=1:07の予定どおりに始まる前の日の夜など）なら何もせず終わり、次の起動予定に任せる。
      - name: Wait for US close
        id: wait
        if: github.event_name == 'schedule' && steps.mode.outputs.light == '0'
        run: |
          python -c "
          import os, time, datetime as dt
          now = dt.datetime.now(dt.timezone(dt.timedelta(hours=9)))
          t = now.replace(hour=6, minute=25, second=0, microsecond=0)
          if now.hour >= 16:
              t += dt.timedelta(days=1)
          wait = (t - now).total_seconds()
          if wait > 5.5 * 3600:
              print(f'JST {now:%H:%M} / too early, skip')
              print('skip=1', file=open(os.environ['GITHUB_OUTPUT'], 'a'))
          else:
              wait = max(wait, 0)
              print(f'JST {now:%H:%M} / wait {wait:.0f}s')
              time.sleep(wait)"
      - name: Run pipeline
        if: steps.wait.outputs.skip != '1'
        env:
          DASHBOARD_LIGHT: ${{ steps.mode.outputs.light }}
        run: python main.py
      - run: python update_dashboard.py
        if: steps.wait.outputs.skip != '1'
      - if: steps.wait.outputs.skip != '1'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add output/ docs/
          git diff --cached --quiet || git commit -m "chore: update dashboard data"
          git push
      # GitHubは公開リポジトリで60日間アクティビティがないと定期実行を自動停止する。
      # Bot のコミットは活動とみなされないため、フル更新のたびにワークフローを「有効化」してタイマーをリセットする。
      - name: Keep schedule alive
        if: steps.mode.outputs.light == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update_dashboard.yml/enable" || true
