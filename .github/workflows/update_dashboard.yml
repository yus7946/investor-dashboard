name: Update Dashboard

on:
  schedule:
    # ── フル更新（EDINET/JPX/ニュース/バックテスト/決算日を含む重い処理）──
    # JST 8:30 = UTC 23:30（前日）。平日のみ。寄付き前に1回だけ重い取得を行う。
    - cron: "30 23 * * 0-4"
    # ── ライト更新（株価・スマートマネー・シグナル・見通しのみ。毎時）──
    # 日中はJPX/EDINETが更新されないため、値動き系だけを高頻度で更新する。
    # これによりYahoo/JPX/EDINETへの高頻度アクセス（IPブロック）リスクを避ける。
    # JST 10:30 = UTC 1:30
    - cron: "30 1 * * 1-5"
    # JST 11:30 = UTC 2:30
    - cron: "30 2 * * 1-5"
    # JST 12:30 = UTC 3:30（後場寄り）
    - cron: "30 3 * * 1-5"
    # JST 13:30 = UTC 4:30
    - cron: "30 4 * * 1-5"
    # JST 14:30 = UTC 5:30
    - cron: "30 5 * * 1-5"
    # JST 15:10 = UTC 6:10（大引け直後）
    - cron: "10 6 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "更新モード (full=全取得 / light=値動きのみ)"
        required: false
        default: "full"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # スケジュール起動: UTC23:30（JST8:30の寄付き前）だけフル、それ以外の毎時はライト。
      # 手動起動: 入力modeに従う（既定full）。
      - name: Decide mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "light=${{ github.event.inputs.mode == 'light' && '1' || '0' }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 23 * * 0-4" ]; then
            echo "light=0" >> "$GITHUB_OUTPUT"
          else
            echo "light=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Run pipeline
        env:
          DASHBOARD_LIGHT: ${{ steps.mode.outputs.light }}
        run: python main.py
      - run: python update_dashboard.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add output/ docs/
          git diff --cached --quiet || git commit -m "chore: update dashboard data"
          git push
